[package]
name = "fastfind"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Ultra hızlı dosya arama ve yönetim uygulaması (Everything benzeri)"
license = "MIT"

[[bin]]
name = "fastfind"
path = "src/main.rs"

[lib]
name = "fastfind"
path = "src/lib.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
rayon = "1"
crossbeam-channel = "0.5"
notify = "6"
walkdir = "2"
fuzzy-matcher = "0.3"
arboard = "3"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
