[package]
name = "InEverything"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "InEverything: Everything benzeri, iki dilli (Türkçe/İngilizce) ultra hızlı dosya arama ve yönetim uygulaması / ultra fast bilingual file search engine"
license = "MIT"

# İkili adı (dosya adı) `ineverything` (küçük harf, Linux geleneği);
# kütüphane adı ile aynı tutulur. Derleme `cargo build --release`
# ile `target/release/ineverything` üretir.
[[bin]]
name = "ineverything"
path = "src/main.rs"

[lib]
name = "ineverything"
path = "src/lib.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
rayon = "1"
crossbeam-channel = "0.5"
notify = "6"
fuzzy-matcher = "0.3"
memchr = "2"
arboard = "3"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
memmap2 = "0.9"
# Yalnızca pencere/masaüstü logosunu çözmek için (assets/InEverything.jpg);
# bayt kodlayıcı gerekmediği için özellikler daraltıldı.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# "Yolu değiştir" için yerel dosya yöneticisi klasör seçici (Windows/macOS
# yerel diyalog, Linux'ta xdg-desktop-portal).
rfd = "0.17"

[dev-dependencies]
tempfile = "3"

# LTO kapalı: eframe/wgpu bağımlılıklarında tam bağlantı süresi tek başına
# ~90 saniye ekliyor ve çalışma zamanında ölçülebilir kazanç vermiyor.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true
