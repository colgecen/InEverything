name: surum

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release verilecek tag (örn. v0.1.0); boşsa mevcut ref"
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable kur
        uses: dtolnay/rust-toolchain@stable

      - name: Onbellek
        uses: Swatinem/rust-cache@v2

      - name: Release derle
        run: cargo build --release --locked

      - name: exe yükle
        uses: actions/upload-artifact@v4
        with:
          name: InEverything-windows
          path: target/release/InEverything.exe

      - name: GitHub Release oluştur
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: target/release/InEverything.exe
          generate_release_notes: true
