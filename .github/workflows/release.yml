name: surum

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release verilecek tag (örn. v0.1.0); boşsa mevcut ref"
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  derle-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable kur
        uses: dtolnay/rust-toolchain@stable

      - name: Onbellek
        uses: Swatinem/rust-cache@v2

      - name: Release derle
        run: cargo build --release --locked

      - name: exe yükle
        uses: actions/upload-artifact@v4
        with:
          name: InEverything-windows
          path: target/release/InEverything.exe

  derle-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable kur
        uses: dtolnay/rust-toolchain@stable

      - name: Onbellek
        uses: Swatinem/rust-cache@v2

      - name: Release derle
        run: cargo build --release --locked

      - name: AppImage paketle
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/InEverything AppDir/usr/bin/ineverything
          cp icon.png AppDir/InEverything.png
          cat > AppDir/InEverything.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=InEverything
          Exec=ineverything
          Icon=InEverything
          Categories=Utility;
          Comment=Everything benzeri hızlı dosya arama
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=$(dirname "$SELF")
          exec "$HERE/usr/bin/ineverything" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/latest/download/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage AppDir

      - name: AppImage yükle
        uses: actions/upload-artifact@v4
        with:
          name: InEverything-linux
          path: InEverything-x86_64.AppImage

  derle-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable kur
        uses: dtolnay/rust-toolchain@stable

      - name: Onbellek
        uses: Swatinem/rust-cache@v2

      - name: Release derle
        run: cargo build --release --locked

      - name: .app paketle
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          APP="InEverything.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/InEverything "$APP/Contents/MacOS/ineverything"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>InEverything</string>
              <key>CFBundleDisplayName</key>
              <string>InEverything</string>
              <key>CFBundleIdentifier</key>
              <string>com.ineverything.app</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleExecutable</key>
              <string>ineverything</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          zip -r InEverything-macos.zip "$APP"

      - name: .app yükle
        uses: actions/upload-artifact@v4
        with:
          name: InEverything-macos
          path: InEverything-macos.zip

  release:
    needs: [derle-windows, derle-linux, derle-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    steps:
      - name: Eşyaları indir
        uses: actions/download-artifact@v4
        with:
          path: esyalar
          merge-multiple: true

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            esyalar/InEverything.exe
            esyalar/InEverything-x86_64.AppImage
            esyalar/InEverything-macos.zip
          generate_release_notes: true
