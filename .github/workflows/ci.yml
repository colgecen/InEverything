name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  dogrulama:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable kur
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Onbellek
        uses: Swatinem/rust-cache@v2

      - name: fmt kontrolü
        run: cargo fmt --all -- --check

      - name: fmt farkını açıkla
        if: failure()
        shell: pwsh
        run: |
          cargo fmt --all
          $fark = git diff -- src tests
          if ([string]::IsNullOrWhiteSpace($fark)) { exit 0 }
          $satirlar = $fark -split "`r?`n"
          $parca = @()
          $sayac = 1
          foreach ($s in ($satirlar + '__SON__')) {
            if (($s -eq '__SON__') -or ($parca.Count -ge 30)) {
              if ($parca.Count -gt 0) {
                $mesaj = ($parca -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                Write-Host "::notice title=fmt-farki-$sayac::$mesaj"
                $sayac += 1
                $parca = @()
              }
            }
            if ($s -ne '__SON__') { $parca += $s }
          }

      - name: clippy (uyarı = hata)
        run: cargo clippy --all-targets -- -D warnings

      - name: clippy çıktısını açıkla
        if: failure()
        shell: pwsh
        run: |
          $cikti = (cargo clippy --all-targets --message-format short 2>&1 | Out-String) -split "`r?`n" | Select-Object -First 150
          $parca = @()
          $sayac = 1
          foreach ($s in ($cikti + '__SON__')) {
            if (($s -eq '__SON__') -or ($parca.Count -ge 25)) {
              if ($parca.Count -gt 0) {
                $mesaj = ($parca -join "`n") -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
                Write-Host "::notice title=clippy-cikti-$sayac::$mesaj"
                $sayac += 1
                $parca = @()
              }
            }
            if ($s -ne '__SON__') { $parca += $s }
          }

      - name: testler
        run: cargo test --locked

      - name: derleme
        run: cargo build --locked
